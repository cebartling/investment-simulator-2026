name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    # xcode-27 is a public-preview image; its default Xcode is 27.0.
    runs-on: xcode-27
    timeout-minutes: 60
    # The signing and notary secrets live only in this environment, which
    # only v* tags can deploy to.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH; nothing was released."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; nothing was released."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the release environment; nothing was released."
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      # Same pins and checksums as ci.yml; bump both together with the local
      # versions.
      - name: Install tools
        env:
          SWIFTFORMAT_VERSION: 0.64.1
          SWIFTFORMAT_SHA256: 0e5762a848d738602c7a983b26812031e634d85e357db070968b9c805f253eff
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          brew install just
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -o -q "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$tools"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$tools"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          swiftformat --version
          swiftlint version

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      # A temporary keychain holds the Developer ID certificate for this run
      # only; the cleanup step deletes it and the notary key.
      - name: Set up signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          # codesign needs the issuing intermediate to build the chain, and a
          # .p12 may not carry it. The current certificate chains to the
          # original Developer ID CA; renewed ones chain to G2.
          for ca in \
            "DeveloperIDCA.cer 7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f" \
            "DeveloperIDG2CA.cer f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"; do
            read -r file sha256 <<< "$ca"
            curl -fsSL -o "$RUNNER_TEMP/$file" "https://www.apple.com/certificateauthority/$file"
            echo "$sha256  $RUNNER_TEMP/$file" | shasum -a 256 -c -
            security import "$RUNNER_TEMP/$file" -k "$keychain"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Bundle and sign
        env:
          CODESIGN_IDENTITY: "Developer ID Application: Christopher Bartling (RDD45JXSRK)"
        run: just bundle "${{ steps.tag.outputs.version }}" "$GITHUB_RUN_NUMBER"

      - name: Notarize and staple
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          just release-zip "${{ steps.tag.outputs.version }}"
          just notarize "${{ steps.tag.outputs.version }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/Investment-Simulator-${{ steps.tag.outputs.version }}.zip" \
            --generate-notes --verify-tag

      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/DeveloperID*.cer
